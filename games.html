<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Select Game</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container">

    <h1>Select Your Game</h1>

    <h3>Indoor Games</h3>

    <p>
      <input type="radio" disabled> Chess (FULL)
    </p>

    <p>
      <input type="radio" name="game"> Carrom (10 slots left)
    </p>

    <h3>Outdoor Games</h3>

    <p>
      <input type="radio" name="game"> Cricket (5 slots left)
    </p>

    <p>
      <input type="radio" name="game"> Football (12 slots left)
    </p>

    <button class="btn">
      Submit Selection
    </button>

    <p class="warning">
      Once submitted, cannot be changed.
    </p>

  </div>

</body>
</html>
