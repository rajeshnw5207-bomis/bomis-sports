<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOMIS SPORTS SELECTION</title>
    
    <script>
        const enrollmentNo = localStorage.getItem('enrollment_no');
        if (!enrollmentNo) {
            alert("Please login first!");
            window.location.href = "login.html";
        }
    </script>

    <style>
        body {
            background-color: #002147;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            text-align: center;
        }
        header { background-color: #FF8C00; padding: 20px; margin-bottom: 30px; }
        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            flex-wrap: wrap; /* Helps on mobile */
        }
        .selection-box {
            background: white;
            color: #333;
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            width: 100%;
            text-align: left;
        }
        .live-dashboard {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #FF8C00;
            width: 300px;
        }
        .options { margin: 15px 0; display: flex; flex-direction: column; gap: 10px; }
        .submit-btn {
            background: #FF8C00;
            color: white;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        .progress-bar { background: #444; height: 10px; border-radius: 5px; margin: 10px 0; }
        .progress-fill { background: #FF8C00; height: 100%; border-radius: 5px; }
    </style>
</head>
<body>
    <header><h1>Welcome to BOMIS Sports Selection</h1></header>

    <div class="container">
        <div class="selection-box" id="main-ui">
            <h3>Indoor Games</h3>
            <div class="options">
                <label><input type="radio" name="indoor" value="Chess"> Chess</label>
                <label><input type="radio" name="indoor" value="Table Tennis"> Table Tennis</label>
            </div>

            <h3 style="margin-top:20px;">Outdoor Games</h3>
            <div class="options">
                <label><input type="radio" name="outdoor" value="Cricket"> Cricket</label>
                <label><input type="radio" name="outdoor" value="Football"> Football</label>
            </div>

            <button class="submit-btn" onclick="submitSelection()">Submit Selection</button>
        </div>

        <div class="live-dashboard">
            <h3>Live Availability</h3>
            <p>Chess: 12/30</p>
            <div class="progress-bar"><div class="progress-fill" style="width: 40%"></div></div>
            <p>Cricket: 28/30</p>
            <div class="progress-bar"><div class="progress-fill" style="width: 93%"></div></div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://bomis-sports-backend.onrender.com";

        async function submitSelection() {
            const indoor = document.querySelector('input[name="indoor"]:checked');
            const outdoor = document.querySelector('input[name="outdoor"]:checked');

            if(!indoor || !outdoor) {
                alert("Please select both games!");
                return;
            }

            const data = {
                enrollment_no: localStorage.getItem('enrollment_no'),
                indoor_game: indoor.value,
                outdoor_game: outdoor.value
            };

            const mainUi = document.getElementById('main-ui');
            mainUi.innerHTML = "<h3>Saving your selection... Please wait.</h3>";

            try {
                const res = await fetch(`${BACKEND_URL}/api/save-selection`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                
                if(result.success) {
                    mainUi.innerHTML = `
                        <div style="text-align:center; padding: 20px; color: #4CAF50;">
                            <h2>Success! ✅</h2>
                            <p>Indoor: ${indoor.value}</p>
                            <p>Outdoor: ${outdoor.value}</p>
                            <button onclick="window.location.reload()" style="margin-top:20px;">Change Selection</button>
                        </div>`;
                } else {
                    alert("Error: " + result.message);
                    location.reload();
                }
            } catch (e) {
                alert("Connection failed. Make sure your Render backend is live.");
                location.reload();
            }
        }
    </script>
</body>
</html>
