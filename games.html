<!DOCTYPE html>
<html lang="en">
    <style>
    body {
        background-color: #002147; /* Deep Navy Blue */
        color: white;
        font-family: 'Segoe UI', sans-serif;
        margin: 0;
        text-align: center;
    }
    header {
        background-color: #FF8C00; /* BOMIS Orange */
        padding: 20px;
        margin-bottom: 30px;
    }
    .container {
        display: flex;
        justify-content: center;
        gap: 40px;
        padding: 20px;
    }
    .selection-box {
        background: white;
        color: #333;
        padding: 30px;
        border-radius: 15px;
        flex: 2;
        text-align: left;
    }
    .live-dashboard {
        background: rgba(255,255,255,0.1);
        padding: 20px;
        border-radius: 15px;
        border: 1px solid #FF8C00;
        flex: 1;
    }
    .submit-btn {
        background: #FF8C00;
        color: white;
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        cursor: pointer;
        margin-top: 20px;
    }
</style>
<head>
    <meta charset="UTF-8">
    <title>BOMIS SPORTS SELECTION</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header><h1>Welcome to BOMIS SPORTS SELECTION</h1></header>

    <div class="container">
        <div class="selection-box" id="main-ui">
            <h3>Indoor Games (Select One)</h3>
            <div class="options">
                <label><input type="radio" name="indoor" value="Chess" required> Chess</label>
                <label><input type="radio" name="indoor" value="Table Tennis"> Table Tennis</label>
            </div>

            <h3 style="margin-top:20px;">Outdoor Games (Select One)</h3>
            <div class="options">
                <label><input type="radio" name="outdoor" value="Cricket" required> Cricket</label>
                <label><input type="radio" name="outdoor" value="Football"> Football</label>
            </div>

            <button class="submit-btn" onclick="submitSelection()">Submit Selection</button>
        </div>

        <div class="live-dashboard">
            <h3>Live Availability</h3>
            <div id="stats">
                <p>Chess: 12/30</p>
                <div class="progress-bar"><div class="progress-fill" style="width: 40%"></div></div>
                <p>Cricket: 28/30</p>
                <div class="progress-bar"><div class="progress-fill" style="width: 93%"></div></div>
            </div>
        </div>
    </div>

    <script>
        function submitSelection() {
            const indoor = document.querySelector('input[name="indoor"]:checked');
            const outdoor = document.querySelector('input[name="outdoor"]:checked');

            if(!indoor || !outdoor) {
                alert("Please select one Indoor and one Outdoor game!");
                return;
            }

            document.getElementById('main-ui').innerHTML = `
                <div style="text-align:center; padding: 40px;">
                    <h2 style="color: #FF8C00;">Selection Successful! ✅</h2>
                    <p><strong>Indoor:</strong> ${indoor.value}</p>
                    <p><strong>Outdoor:</strong> ${outdoor.value}</p>
                    <button onclick="window.location.reload()" style="margin-top:20px;">Change</button>
                </div>
            `;
        }
        
    </script>
</body>
</html>
