<div id="statusMessage" class="status-box"></div>
    </div>
    </div>

    <script>
        let generatedOtp = null;
        let userClassFromServer = null;

        async function verifyEnrollment() {
            const enrollNo = document.getElementById('enrollmentNo').value;
            const response = await fetch(`http://localhost:3000/api/check-status/${enrollNo}`);
            const data = await response.json();
            if (data.verified) {
                document.getElementById('stepTwoArea').style.opacity = "1";
                document.getElementById('stepTwoArea').style.pointerEvents = "auto";
                document.getElementById('btnProceed').disabled = false;
                document.getElementById('statusMessage').innerText = "Enrollment Verified!";
            } else {
                alert("Enrollment Number not found.");
            }
        }

        async function sendOtp() {
            const enrollNo = document.getElementById('enrollmentNo').value;
            const email = document.getElementById('email').value;
            const response = await fetch('http://localhost:3000/api/verify-email', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ enrollNo, email })
            });
            const data = await response.json();
            if (data.success) {
                generatedOtp = data.otp;
                userClassFromServer = data.studentClass;
                document.getElementById('otpSection').style.display = "block";
                alert("OTP sent!");
            }
        }

        function verifyOtp() {
            const userEnteredOtp = document.getElementById('otpInput').value;
            if (userEnteredOtp == generatedOtp && generatedOtp !== null) {
                localStorage.setItem('userClass', userClassFromServer);
                window.location.href = 'games.html';
            } else {
                alert("Incorrect OTP.");
            }
        }
    </script>
</body>
</html>
