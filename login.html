<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container">

    <h1>Student Login</h1>

    <label>Enrollment Number</label>
    <input type="text" placeholder="Enter Enrollment Number">

    <label>Email ID</label>
    <input type="email" placeholder="Enter Email ID">

    <button class="btn" onclick="location.href='otp.html'">
      Get OTP
    </button>

    <p class="note">
      OTP will be sent to registered email only.
    </p>

  </div>

</body>
</html>
