<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOMIS Sports Selection</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { display: flex; height: 100vh; overflow: hidden; }
        
        /* Left Side: The Building Image */
        .left-side { flex: 1.2; background: url('https://thebirlaopenmindsschool.com/images/school-building.jpg') no-repeat center center; background-size: cover; }
        
        /* Right Side: The Blue Login Form */
        .right-side { flex: 0.8; background-color: #002347; color: white; display: flex; flex-direction: column; justify-content: center; padding: 40px; }
        
        h1 { font-size: 2.5rem; margin-bottom: 20px; }
        h1 span { color: #FF9100; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 1rem; color: #ccc; }
        
        input { width: 100%; padding: 12px; border: none; border-radius: 4px; font-size: 1rem; margin-bottom: 10px; }
        
        .btn-verify { width: 100%; padding: 15px; background-color: #FF9100; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-verify:hover { background-color: #e68200; }
        
        .btn-proceed { width: 100%; padding: 15px; background-color: #555; color: #aaa; border: none; border-radius: 4px; font-weight: bold; cursor: default; margin-top: 10px; }
        
        #stepTwoArea { opacity: 0.3; pointer-events: none; transition: 0.5s; margin-top: 20px; }
        #statusMessage { margin-top: 15px; font-size: 0.9rem; text-decoration: underline; }
        #otpSection { display: none; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="left-side"></div>

    <div class="right-side">
        <h1>Welcome to <span>BOMIS</span> Selection</h1>
        
        <div class="form-group">
            <label>Enrollment Number</label>
            <input type="text" id="enrollmentNo" placeholder="e.g. OMLB10054">
            <button class="btn-verify" onclick="verifyEnrollment()">Verify Enrollment</button>
        </div>

        <div id="statusMessage">Waiting for input...</div>

        <div id="stepTwoArea">
            <div class="form-group">
                <label>Email ID</label>
                <input type="email" id="email" placeholder="Enter Registered Email">
                <button class="btn-verify" style="background-color: #444;" id="btnSendOtp" onclick="sendOtp()">Send OTP</button>
            </div>
        </div>

        <div id="otpSection">
            <input type="text" id="otpInput" placeholder="Enter 6-digit OTP">
            <button class="btn-verify" onclick="verifyOtp()">Proceed to Selection</button>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://bomis-sports-backend.onrender.com";
        let generatedOtp = null;

        async function verifyEnrollment() {
            const enrollNo = document.getElementById('enrollmentNo').value.trim();
            const msg = document.getElementById('statusMessage');
            const stepTwo = document.getElementById('stepTwoArea');

            if (!enrollNo) return alert("Please enter Enrollment Number");

            msg.innerHTML = "Connecting to server...";
            msg.style.color = "#FF9100";

            try {
                const response = await fetch(`${BACKEND_URL}/api/check-status/${enrollNo}`);
                const data = await response.json();

                if (data.verified) {
                    msg.style.color = "#4CAF50";
                    msg.innerHTML = `Welcome, ${data.studentName}! Enrollment Verified.`;
                    stepTwo.style.opacity = "1";
                    stepTwo.style.pointerEvents = "all";
                    localStorage.setItem('enrollmentNo', enrollNo);
                } else {
                    msg.style.color = "#FF5252";
                    msg.innerHTML = "Enrollment number not found.";
                }
            } catch (error) {
                msg.innerHTML = "Server waking up... please try again in 30 seconds.";
            }
        }

        async function sendOtp() {
            const enrollNo = localStorage.getItem('enrollmentNo');
            const email = document.getElementById('email').value.trim();
            const msg = document.getElementById('statusMessage');

            try {
                const response = await fetch(`${BACKEND_URL}/api/verify-email`, {
                    method: 'POST',
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ enrollNo, email })
                });
                const data = await response.json();

                if (data.success) {
                    generatedOtp = Math.floor(100000 + Math.random() * 900000);
                    alert("YOUR OTP FOR TESTING: " + generatedOtp);
                    document.getElementById('otpSection').style.display = "block";
                    msg.innerHTML = "OTP Sent to email!";
                } else {
                    msg.style.color = "#FF5252";
                    msg.innerHTML = "Email does not match our records.";
                }
            } catch (e) { alert("Connection Error"); }
        }

        function verifyOtp() {
            const userInput = document.getElementById('otpInput').value;
            if (userInput == generatedOtp) {
                window.location.href = "sports-selection.html";
            } else {
                alert("Invalid OTP. Try again.");
            }
        }
    </script>
</body>
</html>
