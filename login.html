<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOMIS Sports Selection</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { display: flex; height: 100vh; overflow: hidden; background-color: #fff; }
        .left-side { flex: 1.2; background: url('images/school.jpeg') no-repeat center center; background-size: cover; }
        .right-side { flex: 0.8; background-color: #002347; color: white; display: flex; flex-direction: column; justify-content: center; padding: 60px; }
        h1 { font-size: 2.5rem; margin-bottom: 25px; }
        h1 span { color: #FF9100; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #ccc; }
        input { width: 100%; padding: 14px; border: none; border-radius: 4px; font-size: 1rem; margin-bottom: 10px; color: #333; }
        .btn-verify { width: 100%; padding: 15px; background-color: #FF9100; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: background-color 0.3s ease; }
        /* Disabled state for Send OTP button */
        .btn-verify:disabled { background-color: #2c3e50 !important; cursor: not-allowed; opacity: 0.8; }
        #statusMessage { margin: 15px 0; font-size: 0.95rem; min-height: 20px; font-weight: bold; }
        #stepTwoArea, #otpSection { display: none; margin-top: 20px; border-top: 1px solid #1a3b5c; padding-top: 20px; }
    </style>
</head>
<body>
    <div class="left-side"></div>
    <div class="right-side">
        <h1>Welcome to <span>BOMIS</span> Sports Selection</h1>
        <div class="form-group">
            <label>Enrollment Number</label>
            <input type="text" id="enrollment_no" placeholder="e.g. 19BLB0003">
            <button class="btn-verify" onclick="verifyEnrollment()">Verify Enrollment</button>
            <div id="statusMessage"></div> 
        </div>

        <div id="stepTwoArea">
            <div class="form-group">
                <label>Email ID</label>
                <input type="email" id="email" placeholder="Enter Registered Email">
                <button id="sendOtpBtn" class="btn-verify" onclick="sendOtp()" disabled>Send OTP</button>
            </div>
        </div>

        <div id="otpSection">
            <div class="form-group">
                <label>OTP Verification</label>
                <input type="text" id="otpInput" placeholder="Enter 6-digit OTP">
                <button class="btn-verify" onclick="verifyOtp()">Proceed</button>
            </div>
        </div>
    </div>

<script>
    const BACKEND_URL = "https://bomis-sports-backend.onrender.com";
    let generatedOtp = null;

    async function verifyEnrollment() {
        const enrollNo = document.getElementById('enrollment_no').value.trim();
        const msg = document.getElementById('statusMessage');
        const sendBtn = document.getElementById('sendOtpBtn');
        
        if(!enrollNo) { alert("Please enter Enrollment Number"); return; }
        
        msg.style.color = "#FF9100";
        msg.innerHTML = "Verifying...";
        
        try {
            const response = await fetch(`${BACKEND_URL}/api/check-status/${enrollNo}`);
            const data = await response.json();
            
            if (data.verified) {
                msg.style.color = "#4CAF50";
                msg.innerHTML = "Enrollment Verified! Please enter email.";
                document.getElementById('stepTwoArea').style.display = "block";
                
                // UNLOCK AND COLOR THE BUTTON
                sendBtn.disabled = false;
                sendBtn.style.backgroundColor = "#FF9100";
                
                localStorage.setItem('enrollment_no', enrollNo);
            } else {
                msg.style.color = "#FF5252";
                msg.innerHTML = "Enrollment not found.";
                sendBtn.disabled = true;
            }
        } catch (e) { 
            msg.style.color = "#FF5252";
            msg.innerHTML = "Connection Error. Check if Render is live."; 
        }
    }

    async function sendOtp() {
        const email = document.getElementById('email').value.trim();
        const enrollment_no = localStorage.getItem('enrollment_no');
        
        if(!email) { alert("Please enter your email"); return; }

        try {
            const response = await fetch(`${BACKEND_URL}/api/verify-email`, {
                method: 'POST',
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ enrollment_no, email })
            });
            
            const data = await response.json();
            
            if (data.success) {
                generatedOtp = data.otp; 
                alert("A verification code has been sent to your email!");
                document.getElementById('otpSection').style.display = "block";
            } else { 
                alert("Email mismatch. Please use your registered school email."); 
            }
        } catch (e) { 
            alert("Connection Error.");
        }
    }

    function verifyOtp() {
        const inputOtp = document.getElementById('otpInput').value.trim();
        if (inputOtp == generatedOtp) {
            window.location.href = "games.html";
        } else { 
            alert("Invalid OTP"); 
        }
    }
</script>
</body>
</html>
