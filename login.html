<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOMIS Sports Selection</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { display: flex; height: 100vh; overflow: hidden; background-color: #fff; }
        .left-side { flex: 1.2; background: url('images/school.jpeg') no-repeat center center; background-size: cover; }
        .right-side { flex: 0.8; background-color: #002347; color: white; display: flex; flex-direction: column; justify-content: center; padding: 60px; }
        h1 { font-size: 2.5rem; margin-bottom: 25px; }
        h1 span { color: #FF9100; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #ccc; }
        input { width: 100%; padding: 14px; border: none; border-radius: 4px; font-size: 1rem; margin-bottom: 10px; color: #333; outline: none; }
        .btn-verify { width: 100%; padding: 15px; background-color: #FF9100; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        #statusMessage { margin: 15px 0; font-size: 0.95rem; font-weight: bold; }
        #stepTwoArea, #otpSection { display: none; margin-top: 20px; border-top: 1px solid #1a3b5c; padding-top: 20px; }
        .otp-box { background: #FFF3E0; padding: 15px; border: 2px solid #FF9100; border-radius: 8px; text-align: center; color: #333; }
    </style>
</head>
<body>
    <div class="left-side"></div>
    <div class="right-side">
        <h1>Welcome to <span>BOMIS</span> Sports Selection</h1>
        <div class="form-group">
            <label>Enrollment Number</label>
            <input type="text" id="enrollment_no" placeholder="e.g. 19BLB0003">
            <button id="verifyEnrollBtn" class="btn-verify" onclick="verifyEnrollment()">Verify Enrollment</button>
            <div id="statusMessage"></div> 
        </div>
        <div id="stepTwoArea">
            <div class="form-group">
                <label>Registered Email ID</label>
                <input type="email" id="email" placeholder="Enter Registered Email">
                <button id="sendOtpBtn" class="btn-verify" onclick="sendOtp()" disabled>Verify Email</button>
            </div>
        </div>
        <div id="otpSection">
            <div class="form-group">
                <label>Enter Code Shown Above</label>
                <input type="text" id="otpInput" maxlength="6" placeholder="000000">
                <button class="btn-verify" onclick="verifyOtp()">Proceed</button>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://bomis-sports-backend.onrender.com";
        let generatedOtp = null;

        async function verifyEnrollment() {
            const enrollNo = document.getElementById('enrollment_no').value.trim().toUpperCase();
            const msg = document.getElementById('statusMessage');
            if(!enrollNo) return;
            msg.innerHTML = "Checking...";
            try {
                const res = await fetch(`${BACKEND_URL}/api/check-status/${enrollNo}`);
                const data = await res.json();
                if (data.verified) {
                    msg.style.color = "#4CAF50";
                    msg.innerHTML = `Welcome, ${data.studentName}!`;
                    document.getElementById('stepTwoArea').style.display = "block";
                    document.getElementById('sendOtpBtn').disabled = false;
                    localStorage.setItem('enrollment_no', enrollNo);
                } else {
                    msg.style.color = "#FF5252";
                    msg.innerHTML = "Not found.";
                }
            } catch (e) { msg.innerHTML = "Server waking up..."; }
        }

        async function sendOtp() {
            const email = document.getElementById('email').value.trim();
            const enrollment_no = localStorage.getItem('enrollment_no');
            try {
                const res = await fetch(`${BACKEND_URL}/api/verify-email`, {
                    method: 'POST',
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ enrollment_no, email })
                });
                const data = await res.json();
                if (data.success) {
                    generatedOtp = data.otp;
                    document.getElementById('statusMessage').innerHTML = `
                        <div class="otp-box">
                            <strong>Your Code:</strong><br>
                            <span style="font-size: 24px; letter-spacing: 5px;">${data.otp}</span>
                        </div>`;
                    document.getElementById('otpSection').style.display = "block";
                } else { alert(data.message); }
            } catch (e) { alert("Error connecting."); }
        }

        function verifyOtp() {
            if (document.getElementById('otpInput').value == generatedOtp) {
                window.location.href = "games.html";
            } else { alert("Invalid code."); }
        }
    </script>
</body>
</html>
