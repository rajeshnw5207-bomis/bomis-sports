<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOMIS Sports Selection</title>
    <style>
        /* COLOR CODES ARE HERE */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { display: flex; height: 100vh; overflow: hidden; background-color: #fff; }
        
        /* IMAGE URL IS HERE */
        .left-side { 
            flex: 1.2; 
            background: url('images/school.jpeg') no-repeat center center; 
            background-size: cover; 
            background-color: #f0f0f0; /* Backup color if image fails */
        }
        
        .right-side { 
            flex: 0.8; 
            background-color: #002347; /* Dark Blue */
            color: white; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            padding: 60px; 
        }
        
        h1 { font-size: 2.5rem; margin-bottom: 25px; }
        h1 span { color: #FF9100; /* BOMIS Orange */ }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #ccc; }
        
        input { 
            width: 100%; padding: 14px; border: none; border-radius: 4px; 
            font-size: 1rem; margin-bottom: 10px; color: #333; outline: none; 
        }
        
        .btn-verify { 
            width: 100%; padding: 15px; background-color: #FF9100; 
            color: white; border: none; border-radius: 4px; 
            font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.3s; 
        }
        
        .btn-verify:hover { background-color: #e68200; }
        
        .btn-verify:disabled { 
            background-color: #2c3e50 !important; 
            cursor: not-allowed; opacity: 0.8; 
        }
        
        #statusMessage { margin: 15px 0; font-size: 0.95rem; min-height: 20px; font-weight: bold; }
        #stepTwoArea, #otpSection { display: none; margin-top: 20px; border-top: 1px solid #1a3b5c; padding-top: 20px; }
    </style>
</head>
<body>
    <div class="left-side"></div>
    <div class="right-side">
        <h1>Welcome to <span>BOMIS</span> Sports Selection</h1>
        
        <div class="form-group">
            <label>Enrollment Number</label>
            <input type="text" id="enrollment_no" placeholder="e.g. 19BLB0003">
            <button id="verifyEnrollBtn" class="btn-verify" onclick="verifyEnrollment()">Verify Enrollment</button>
            <div id="statusMessage"></div> 
        </div>

        <div id="stepTwoArea">
            <div class="form-group">
                <label>Registered Email ID</label>
                <input type="email" id="email" placeholder="Enter Registered Email">
                <button id="sendOtpBtn" class="btn-verify" onclick="sendOtp()" disabled>Send OTP</button>
            </div>
        </div>

        <div id="otpSection">
            <div class="form-group">
                <label>Enter 6-digit OTP</label>
                <input type="text" id="otpInput" maxlength="6" placeholder="000000">
                <button class="btn-verify" onclick="verifyOtp()">Proceed to Selection</button>
            </div>
        </div>
    </div>

    <script>
        // YOUR BACKEND LOGIC
        const BACKEND_URL = "https://bomis-sports-backend.onrender.com";
        let generatedOtp = null;

        async function verifyEnrollment() {
            const enrollNo = document.getElementById('enrollment_no').value.trim().toUpperCase();
            const msg = document.getElementById('statusMessage');
            const enrollBtn = document.getElementById('verifyEnrollBtn');
            const sendBtn = document.getElementById('sendOtpBtn');
            
            if(!enrollNo) { alert("Please enter Enrollment Number"); return; }
            
            enrollBtn.disabled = true;
            msg.style.color = "#FF9100";
            msg.innerHTML = "Checking database...";
            
            try {
                const response = await fetch(`${BACKEND_URL}/api/check-status/${enrollNo}`);
                const data = await response.json();
                
                if (data.verified) {
                    msg.style.color = "#4CAF50";
                    msg.innerHTML = `Welcome, ${data.studentName}! Please enter your email.`;
                    document.getElementById('stepTwoArea').style.display = "block";
                    sendBtn.disabled = false;
                    localStorage.setItem('enrollment_no', enrollNo);
                } else {
                    msg.style.color = "#FF5252";
                    msg.innerHTML = "Enrollment not found.";
                    enrollBtn.disabled = false;
                }
            } catch (e) { 
                msg.style.color = "#FF5252";
                msg.innerHTML = "Server waking up. Please wait 30s.";
                enrollBtn.disabled = false;
            }
        }

        async function sendOtp() {
            const emailInput = document.getElementById('email').value.trim();
            const enrollment_no = localStorage.getItem('enrollment_no');
            const sendBtn = document.getElementById('sendOtpBtn');
            
            if(!emailInput) { alert("Please enter email"); return; }
            sendBtn.disabled = true;
            sendBtn.innerHTML = "Sending...";

            try {
                const response = await fetch(`${BACKEND_URL}/api/verify-email`, {
                    method: 'POST',
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ enrollment_no, email: emailInput })
                });
                const data = await response.json();
                if (data.success) {
                    generatedOtp = data.otp;
                    alert("OTP Sent!");
                    document.getElementById('otpSection').style.display = "block";
                } else {
                    alert(data.message || "Error");
                    sendBtn.disabled = false;
                }
            } catch (e) { alert("Server error"); sendBtn.disabled = false; }
        }

        function verifyOtp() {
            if (document.getElementById('otpInput').value.trim() == generatedOtp) {
                window.location.href = "games.html";
            } else { alert("Invalid OTP"); }
        }
    </script>
</body>
</html>
