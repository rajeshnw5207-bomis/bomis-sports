<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOMIS Sports Login</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 50px; }
        .container { max-width: 400px; width: 100%; border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        #statusMessage { margin-top: 15px; font-weight: bold; }
        #stepTwoArea, #otpSection { display: none; margin-top: 20px; border-top: 1px dashed #ccc; padding-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Student Login</h2>
        <div id="stepOne">
            <input type="text" id="enrollmentNo" placeholder="Enrollment Number (e.g., OMLB10054)">
            <button onclick="verifyEnrollment()">Verify Enrollment</button>
        </div>

        <div id="statusMessage">Page Loaded. Waiting for input...</div>

        <div id="stepTwoArea">
            <input type="email" id="email" placeholder="Enter Registered Email">
            <button onclick="sendOtp()">Send OTP</button>
        </div>

        <div id="otpSection">
            <input type="text" id="otpInput" placeholder="Enter 6-digit OTP">
            <button onclick="verifyOtp()">Login</button>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://bomis-sports-backend.onrender.com";
        let generatedOtp = null;

        async function verifyEnrollment() {
            const enrollNo = document.getElementById('enrollmentNo').value.trim();
            const msg = document.getElementById('statusMessage');
            if (!enrollNo) return alert("Enter enrollment number");

            msg.innerHTML = "Connecting to server...";
            msg.style.color = "blue";

            try {
                const response = await fetch(`${BACKEND_URL}/api/check-status/${enrollNo}`);
                const data = await response.json();

                if (data.verified) {
                    msg.style.color = "green";
                    msg.innerHTML = `Welcome, ${data.studentName}!`;
                    document.getElementById('stepTwoArea').style.display = "block";
                    localStorage.setItem('enrollmentNo', enrollNo);
                } else {
                    msg.style.color = "red";
                    msg.innerHTML = "Enrollment number not found.";
                }
            } catch (error) {
                msg.innerHTML = "Server waking up... try again in 30s.";
            }
        }

        async function sendOtp() {
            const enrollNo = localStorage.getItem('enrollmentNo');
            const email = document.getElementById('email').value.trim();
            try {
                const response = await fetch(`${BACKEND_URL}/api/verify-email`, {
                    method: 'POST',
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ enrollNo, email })
                });
                const data = await response.json();
                if (data.success) {
                    generatedOtp = Math.floor(100000 + Math.random() * 900000);
                    alert("YOUR OTP: " + generatedOtp);
                    document.getElementById('otpSection').style.display = "block";
                } else {
                    alert("Email does not match.");
                }
            } catch (e) { alert("Server error"); }
        }

        function verifyOtp() {
            if (document.getElementById('otpInput').value == generatedOtp) {
                window.location.href = "sports-selection.html";
            } else { alert("Invalid OTP"); }
        }
    </script>
</body>
</html>
