<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOMIS Sports Selection</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        /* Fixed body overflow but allowed the right side to scroll if content grows */
        body { display: flex; height: 100vh; background-color: #fff; overflow: hidden; }
        
        .left-side { 
            flex: 1.2; 
            background: url('images/school.jpeg') no-repeat center center; 
            background-size: cover; 
        }
        
        .right-side { 
            flex: 0.8; 
            background-color: #002347; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            padding: 40px 60px;
            /* FIX: Allow scrolling so the button is never cut off */
            overflow-y: auto; 
        }
        
        h1 { font-size: 2.2rem; margin-bottom: 25px; }
        h1 span { color: #FF9100; }
        
        .form-group { margin-bottom: 20px; width: 100%; }
        label { display: block; margin-bottom: 8px; color: #ccc; }
        
        input { 
            width: 100%; padding: 14px; border: none; border-radius: 4px; 
            font-size: 1rem; margin-bottom: 10px; color: #333; outline: none; 
        }
        
        .btn-verify { 
            width: 100%; padding: 15px; background-color: #FF9100; 
            color: white; border: none; border-radius: 4px; 
            font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.3s;
        }
        
        .btn-verify:hover { background-color: #e68200; }
        .btn-verify:disabled { background-color: #2c3e50 !important; cursor: not-allowed; opacity: 0.8; }
        
        #statusMessage { margin: 15px 0; font-size: 0.95rem; font-weight: bold; min-height: 20px; }
        
        #stepTwoArea, #otpSection { 
            display: none; 
            margin-top: 20px; 
            border-top: 1px solid #1a3b5c; 
            padding-top: 20px; 
            animation: fadeIn 0.5s ease;
        }

        .otp-box { 
            background: #FFF3E0; 
            padding: 15px; 
            border: 2px solid #FF9100; 
            border-radius: 8px; 
            text-align: center; 
            color: #333; 
            margin-bottom: 15px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile Responsive adjustment */
        @media (max-width: 768px) {
            body { flex-direction: column; overflow-y: auto; }
            .left-side { display: none; }
            .right-side { flex: 1; padding: 40px 20px; }
        }
    </style>
</head>
<body>
    <div class="left-side"></div>
    <div class="right-side">
        <h1>Welcome to <span>BOMIS</span> Sports Selection</h1>
        
        <div class="form-group">
            <label>Enrollment Number</label>
            <input type="text" id="enrollment_no" placeholder="e.g. 19BLB0003">
            <button id="verifyEnrollBtn" class="btn-verify" onclick="verifyEnrollment()">Verify Enrollment</button>
            <div id="statusMessage"></div> 
        </div>

        <div id="stepTwoArea">
            <div class="form-group">
                <label>Registered Email ID</label>
                <input type="email" id="email" placeholder="Enter Registered Email">
                <button id="sendOtpBtn" class="btn-verify" onclick="sendOtp()" disabled>Verify Email</button>
            </div>
        </div>

        <div id="otpSection">
            <div class="form-group">
                <label>Enter Code Shown Above</label>
                <input type="text" id="otpInput" maxlength="6" placeholder="000000">
                <button id="proceedBtn" class="btn-verify" onclick="verifyOtp()">Proceed to Selection</button>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://bomis-sports-backend.onrender.com";
        let generatedOtp = null;

        async function verifyEnrollment() {
            const enrollNo = document.getElementById('enrollment_no').value.trim().toUpperCase();
            const msg = document.getElementById('statusMessage');
            const enrollBtn = document.getElementById('verifyEnrollBtn');
            
            if(!enrollNo) { alert("Please enter Enrollment Number"); return; }
            
            enrollBtn.disabled = true;
            msg.style.color = "#FF9100";
            msg.innerHTML = "Checking...";
            
            try {
                const response = await fetch(`${BACKEND_URL}/api/check-status/${enrollNo}`);
                const data = await response.json();
                
                if (data.verified) {
                    msg.style.color = "#4CAF50";
                    msg.innerHTML = `Welcome, ${data.studentName}!`;
                    document.getElementById('stepTwoArea').style.display = "block";
                    document.getElementById('sendOtpBtn').disabled = false;
                    localStorage.setItem('enrollment_no', enrollNo);
                } else {
                    msg.style.color = "#FF5252";
                    msg.innerHTML = "Enrollment not found.";
                    enrollBtn.disabled = false;
                }
            } catch (e) { 
                msg.style.color = "#FF5252";
                msg.innerHTML = "Server connection error.";
                enrollBtn.disabled = false;
            }
        }

        async function sendOtp() {
            const email = document.getElementById('email').value.trim();
            const enrollment_no = localStorage.getItem('enrollment_no');
            const sendBtn = document.getElementById('sendOtpBtn');
            const msg = document.getElementById('statusMessage');

            if(!email) { alert("Please enter email"); return; }

            sendBtn.disabled = true;
            sendBtn.innerHTML = "Verifying...";

            try {
                const res = await fetch(`${BACKEND_URL}/api/verify-email`, {
                    method: 'POST',
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ enrollment_no, email })
                });
                const data = await res.json();
                
                if (data.success) {
                    generatedOtp = data.otp;
                    msg.innerHTML = `
                        <div class="otp-box">
                            <strong>Your Verification Code:</strong><br>
                            <span style="font-size: 28px; letter-spacing: 6px; font-weight: bold;">${data.otp}</span>
                        </div>`;
                    document.getElementById('otpSection').style.display = "block";
                    sendBtn.innerHTML = "Verified";
                } else { 
                    alert(data.message); 
                    sendBtn.disabled = false;
                    sendBtn.innerHTML = "Verify Email";
                }
            } catch (e) { 
                alert("Error connecting to server."); 
                sendBtn.disabled = false;
            }
        }

        function verifyOtp() {
            const input = document.getElementById('otpInput').value.trim();
            if (input == generatedOtp && generatedOtp !== null) {
                window.location.href = "games.html";
            } else { 
                alert("Invalid code. Please enter the number shown in the orange box."); 
            }
        }
    </script>
</body>
</html>
