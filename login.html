<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOMIS Sports Selection</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { display: flex; height: 100vh; overflow: hidden; background-color: #fff; }
        .left-side { flex: 1.2; background: url('images/school.jpeg') no-repeat center center; background-size: cover; }
        .right-side { flex: 0.8; background-color: #002347; color: white; display: flex; flex-direction: column; justify-content: center; padding: 60px; }
        h1 { font-size: 2.5rem; margin-bottom: 25px; }
        h1 span { color: #FF9100; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #ccc; }
        input { width: 100%; padding: 14px; border: none; border-radius: 4px; font-size: 1rem; margin-bottom: 10px; color: #333; }
        .btn-verify { width: 100%; padding: 15px; background-color: #FF9100; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        #statusMessage { margin: 15px 0; font-size: 0.95rem; color: #FF9100; min-height: 20px; }
        #stepTwoArea, #otpSection { display: none; margin-top: 20px; border-top: 1px solid #1a3b5c; padding-top: 20px; }
    </style>
</head>
<body>
    <div class="left-side"></div>
    <div class="right-side">
        <h1>Welcome to <span>BOMIS</span> Sports Selection</h1>
        <div class="form-group">
            <label>Enrollment Number</label>
            <input type="text" id="enrollmentNo" placeholder="e.g. OMLB10054">
            <button class="btn-verify" onclick="verifyEnrollment()">Verify Enrollment</button>
        </div>
        
        <div id="stepTwoArea">
            <div class="form-group">
                <label>Email ID</label>
                <input type="email" id="email" placeholder="Enter Registered Email">
                <button class="btn-verify" style="background-color: #2c3e50;" onclick="sendOtp()">Send OTP</button>
            </div>
        </div>
        <div id="otpSection">
            <div class="form-group">
                <label>OTP Verification</label>
                <input type="text" id="otpInput" placeholder="Enter 6-digit OTP">
                <button class="btn-verify" onclick="verifyOtp()">Proceed</button>
            </div>
        </div>
    </div>
    <script>
        const BACKEND_URL = "https://bomis-sports-backend.onrender.com";
        let generatedOtp = null;

        async function verifyEnrollment() {
            const enrollNo = document.getElementById('enrollmentNo').value.trim();
            const msg = document.getElementById('statusMessage');
            if(!enrollNo) { alert("Please enter Enrollment Number"); return; }
            msg.innerHTML = "Verifying...";
            try {
                // FIXED: URL matches the backend route exactly
                const response = await fetch(`${BACKEND_URL}/api/check-status/${enrollNo}`);
                const data = await response.json();
                if (data.verified) {
                    msg.style.color = "#4CAF50";
                    msg.innerHTML = "Enrollment Verified! Please enter email.";
                    document.getElementById('stepTwoArea').style.display = "block";
                    localStorage.setItem('enrollmentNo', enrollNo);
                } else {
                    msg.style.color = "#FF5252";
                    msg.innerHTML = "Enrollment not found.";
                }
            } catch (e) { msg.innerHTML = "Connection Error."; }
        }

        async function sendOtp() {
            const email = document.getElementById('email').value.trim();
            const enrollNo = localStorage.getItem('enrollmentNo');
            try {
                const response = await fetch(`${BACKEND_URL}/api/verify-email`, {
                    method: 'POST',
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ enrollNo, email })
                });
                const data = await response.json();
                if (data.success) {
                    generatedOtp = Math.floor(100000 + Math.random() * 900000);
                    alert("YOUR OTP: " + generatedOtp);
                    document.getElementById('otpSection').style.display = "block";
                } else { alert("Email mismatch."); }
            } catch (e) { alert("Connection Error"); }
        }

        function verifyOtp() {
            if (document.getElementById('otpInput').value == generatedOtp) {
                window.location.href = "sports-selection.html";
            } else { alert("Invalid OTP"); }
        }
    </script>
</body>
</html>
